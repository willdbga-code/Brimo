<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gold-moon" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#c29d38"/>
      <stop offset="100%" stop-color="#806010"/>
    </linearGradient>
    <radialGradient id="purple-glow" cx="16" cy="16" r="12" fx="16" fy="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b866ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#8b32cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06020c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  {/* Dark background */}
  <rect width="32" height="32" rx="7" fill="#06020c" stroke="rgba(194, 157, 56, 0.15)" stroke-width="1" />
  
  {/* Glow */}
  <circle cx="16" cy="16" r="12" fill="url(#purple-glow)" />
  
  {/* Alchemical Outer Ring */}
  <circle cx="16" cy="16" r="13" fill="none" stroke="rgba(194, 157, 56, 0.25)" stroke-width="0.8" stroke-dasharray="2 1.5" />
  
  {/* Golden Crescent Moon */}
  <path d="M 13.5,8 A 8,8 0 1 0 24,18.5 A 6.5,6.5 0 1 1 13.5,8 Z" fill="url(#gold-moon)" />
  
  {/* Central Sigil Star */}
  <path d="M 21.5,9.5 L 22,11.5 L 24,12 L 22,12.5 L 21.5,14.5 L 21,12.5 L 19,12 L 21,11.5 Z" fill="#ffffff" />
</svg>
